# The FORMAT version — the negotiation handle for every reader of this project's
# artifacts, the runtime and outside tools alike. Declared here, top level, exactly
# once — never copied into another file. The reader contract (what bumps it, how a
# missing/duplicate/unknown value is read) is templates/FORMATS.md "The format
# version". Distinct from .grovespec/VERSION, which names the runtime bundle.
version: 1

# Language for the CONTENT of generated artifacts (specs, brief, conventions, reviews).
# Headers and field names stay fixed (English) — only the prose is written in this language.
# Set once at init: match existing docs if any, otherwise the language the user works in. en | ko | ja | ...
language: en

# Only the paths (locations) are changeable. The structure is fixed.
# Every path below is a RELATIVE path inside the project, spelled the way the
# filesystem spells it (case included). Absolute · drive-relative (C:src) · '..'
# escaping the project · the project root itself ('.') are refused: these paths are
# compared against git's own output, and a spelling git never prints is a comparison
# that never matches — which reads as "nothing to report", not as an error.
# `./x/`, `x//`, `a/../x` are accepted (one canonical form), just never needed.
paths:
  brief: docs/brief.md
  tree: docs/tree.md
  conventions: docs/conventions.md
  tasks: docs/tasks/
  ref: docs/ref/
  findings: docs/findings.md          # brownfield backlog — node-level bugs·duplications·doc↔code mismatches. Optional: created only if non-empty.
  restructuring: docs/restructuring.md # brownfield backlog — tree-level structural debt. Optional: created only if non-empty.
  requests: docs/requests.md          # interjected work put off to the next milestone (FORMATS.md "Interjected work"). Optional.
  src: src/                 # where implemented code goes
  tests: tests/             # where tests go
  review: .grovespec/review/  # cold-review state (<id>.verify.yaml + <id>.review.yaml per node)

# Cold-review defaults (overridable per node). TWO cold-review steps share one engine:
#   verify = the SPEC (the draft) — code not written yet.
#   review = the CODE (this node's DIFF only) + the test results.
# Findings are classified by CATEGORY with fixed handling (reviewers.md §Categories):
# the five must-fix categories block; improvement · harmless-bug are recorded, never queued.

# verify — cold-review: a node's draft spec (C1–C6) AND, once at init, the whole sketch tree's decomposition (D1–D5). Same scale/models.
verify:
  find_streak: 2     # N — find closes after N CONSECUTIVE waves that confirm no NEW must-fix
                     # finding (a new one resets the counter to 0; re-finds and record-only
                     # items don't count either way — reviewers.md §The cycle).
  max_rounds: 30     # the escalation trigger on FIND waves, not the terminator — the CYCLE ends when
                     # the find streak is met and every confirmed must-fix item is closed.
  # Reviewer model — OPTIONAL. Omit → every reviewer inherits the session model (the portable default).
  # RECOMMENDED split if you customize: keep the broad finders on a cheap model (they drive recall), and lift only
  # the deepest-reasoning lens to a stronger one (it sets the ceiling). Use model ids your host accepts:
  # models:
  #   default: <fast-model-id>       # finder breadth — consumer-impersonator · gap-finder · non-expert · breaker
  #   coherence: <strong-model-id>   # the spec lens needing the most reasoning (decomposition · cross-contract fit)
  # reviewer count per wave, scaled to the change’s reach. verify picks the level.
  scale:
    skip:     { reviewers: 0 }   # trivial spec edit (format·comment)
    light:    { reviewers: 2 }   # small, contract unchanged
    standard: { reviewers: 3 }   # a normal new node
    full:     { reviewers: 5 }   # an already-used contract changes / 3+ consumers / a skeleton / security

# review — code cold-review on THIS NODE'S DIFF only (never the whole codebase) + tests.
review:
  test: ""           # command to run this project's tests (e.g. "pytest -q", "npm test"). NOT asked at init — auto-detected:
                     #   brownfield: filled from the project at init · greenfield: empty until the first review derives it from the stack (asked only if undeterminable).
  find_streak: 2     # N — same rule as verify: consecutive no-new-must-fix waves that end find.
  plan_streak: 2     # M — a fix PLAN is applied only after M consecutive clean cold reviews of
                     # that plan (editing the plan resets its counter — grovespec-fix).
  max_rounds: 30     # the escalation trigger on FIND waves, not the terminator (reaching it is never a pass;
                     # a fix whose confirmation fails twice in a row escalates that item alone).
  # Reviewer model — OPTIONAL. Omit → every reviewer inherits the session model (the portable default).
  # RECOMMENDED split if you customize: cheap model for the broad finders (recall), a stronger one only on the
  # lenses that need deep reasoning (ceiling). Use model ids your host accepts:
  # models:
  #   default: <fast-model-id>        # finder breadth — the-6-month-maintainer · breaker · test-quality
  #   correctness: <strong-model-id>  # subtle logic / contract-violation reasoning
  #   security: <strong-model-id>     # exploit paths the tests rarely cover
  # reviewer count per wave, scaled to the diff’s size·risk. review picks the level.
  scale:
    skip:     { reviewers: 0 }   # trivial diff (format·comment·≤2 lines)
    light:    { reviewers: 2 }   # small diff, no new behavior
    standard: { reviewers: 3 }   # a normal node's implementation
    full:     { reviewers: 5 }   # security-touching / large / changes an already-used contract

# Edit-routing hook — advisory context injected on src/tests edits (see `grovespec
# hooks install|remove|status`; the registration itself lives in .claude/settings.json
# and .codex/hooks.json and is managed by that command, never by hand). 'off' silences
# an installed hook without touching the registration. on | off.
hooks: off
