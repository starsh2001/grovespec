version: 1

# Language for the CONTENT of generated artifacts (specs, brief, conventions, reviews).
# Headers and field names stay fixed (English) — only the prose is written in this language.
# Set once at init: match existing docs if any, otherwise the language the user works in. en | ko | ja | ...
language: en

# Only the paths (locations) are changeable. The structure is fixed.
paths:
  brief: docs/brief.md
  tree: docs/tree.md
  conventions: docs/conventions.md
  tasks: docs/tasks/
  ref: docs/ref/
  findings: docs/findings.md          # brownfield backlog — node-level bugs·duplications·doc↔code mismatches. Optional: created only if non-empty.
  restructuring: docs/restructuring.md # brownfield backlog — tree-level structural debt. Optional: created only if non-empty.
  src: src/                 # where implemented code goes
  tests: tests/             # where tests go
  review: .grovespec/review/  # cold-review state (<id>.verify.yaml + <id>.review.yaml per node)

# Cold-review defaults (overridable per node). TWO cold-review steps share one engine:
#   verify = the SPEC (the draft) — code not written yet.
#   review = the CODE (this node's DIFF only) + the test results.

# verify — cold-review: a node's draft spec (C1–C6) AND, once at init, the whole sketch tree's decomposition (D1–D5). Same scale/strength/models.
verify:
  strength: 2        # how far to block: 1=Critical · 2=+Should Fix · 3=+Nice to Have
  max_rounds: 5
  # Reviewer model — OPTIONAL. Omit → every reviewer inherits the session model (the default: no extra cost, no forced Opus).
  # RECOMMENDED split if you customize: keep the broad finders on a cheap model (they drive recall), and lift only
  # the deepest-reasoning lens + the triage to a stronger one (they set the ceiling + precision). Uncomment to follow:
  # models:
  #   default: sonnet         # finder breadth — consumer-impersonator · gap-finder · non-expert · breaker
  #   coherence: opus         # the spec lens needing the most reasoning (decomposition · cross-contract fit)
  #   triage: opus            # the over-strictness pass — precision, so fewer real findings get dropped
  # reviewer count·repeat, scaled to the change's reach (consumers / skeleton). verify picks the level.
  scale:
    skip:     { reviewers: 0, repeat: 0 }   # trivial spec edit (format·comment)
    light:    { reviewers: 2, repeat: 1 }   # small, contract unchanged
    standard: { reviewers: 3, repeat: 1 }   # a normal new node
    full:     { reviewers: 5, repeat: 2 }   # contract changed / 3+ consumers / a skeleton

# review — code cold-review on THIS NODE'S DIFF only (never the whole codebase) + tests.
review:
  test: ""           # command to run this project's tests (e.g. "pytest -q", "npm test"). NOT asked at init — auto-detected:
                     #   brownfield: filled from the project at init · greenfield: empty until the first review derives it from the stack (asked only if undeterminable).
  strength: 2
  max_rounds: 5
  # Reviewer model — OPTIONAL. Omit → every reviewer inherits the session model (the default: no extra cost, no forced Opus).
  # RECOMMENDED split if you customize: cheap model for the broad finders (recall), a stronger one only on the
  # lenses that need deep reasoning + the triage (ceiling + precision). Uncomment to follow:
  # models:
  #   default: sonnet         # finder breadth — the-6-month-maintainer · breaker · test-quality
  #   correctness: opus       # subtle logic / contract-violation reasoning
  #   security: opus          # exploit paths the tests rarely cover
  #   triage: opus            # the over-strictness pass — precision
  # reviewer count·repeat, scaled to the diff's size·risk (security-touching / big diff → higher). review picks the level.
  scale:
    skip:     { reviewers: 0, repeat: 0 }   # trivial diff (format·comment·≤2 lines)
    light:    { reviewers: 2, repeat: 1 }   # small diff, no new behavior
    standard: { reviewers: 3, repeat: 1 }   # a normal node's implementation
    full:     { reviewers: 5, repeat: 2 }   # security-touching / large / contract-bearing diff
