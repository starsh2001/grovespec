version: 1

# Language for the CONTENT of generated artifacts (specs, brief, conventions, reviews).
# Headers and field names stay fixed (English) — only the prose is written in this language.
# Set once at init: match existing docs if any, otherwise the language the user works in. en | ko | ja | ...
language: en

# Only the paths (locations) are changeable. The structure is fixed.
paths:
  brief: docs/brief.md
  tree: docs/tree.md
  conventions: docs/conventions.md
  tasks: docs/tasks/
  ref: docs/ref/
  src: src/                 # where implemented code goes
  tests: tests/             # where tests go
  review: .grovespec/review/  # cold-review state (<id>.verify.yaml + <id>.review.yaml per node)

# Cold-review defaults (overridable per node). TWO cold-review steps share one engine:
#   verify = the SPEC (the draft) — code not written yet.
#   review = the CODE (this node's DIFF only) + the test results.

# verify — spec cold-review (multi-persona on the draft). Scales to how far the contract reaches.
verify:
  strength: 2        # how far to block: 1=Critical · 2=+Should Fix · 3=+Nice to Have
  max_rounds: 5
  # reviewer count·repeat, scaled to the change's reach (consumers / skeleton). verify picks the level.
  scale:
    skip:     { reviewers: 0, repeat: 0 }   # trivial spec edit (format·comment)
    light:    { reviewers: 2, repeat: 1 }   # small, contract unchanged
    standard: { reviewers: 3, repeat: 1 }   # a normal new node
    full:     { reviewers: 5, repeat: 2 }   # contract changed / 3+ consumers / a skeleton

# review — code cold-review on THIS NODE'S DIFF only (never the whole codebase) + tests.
review:
  test: ""           # command to run this project's tests (e.g. "pytest -q", "npm test"). Empty → review infers/asks.
  strength: 2
  max_rounds: 5
  # reviewer count·repeat, scaled to the diff's size·risk (security-touching / big diff → higher). review picks the level.
  scale:
    skip:     { reviewers: 0, repeat: 0 }   # trivial diff (format·comment·≤2 lines)
    light:    { reviewers: 2, repeat: 1 }   # small diff, no new behavior
    standard: { reviewers: 3, repeat: 1 }   # a normal node's implementation
    full:     { reviewers: 5, repeat: 2 }   # security-touching / large / contract-bearing diff
