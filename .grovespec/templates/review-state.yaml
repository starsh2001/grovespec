# State of one cold-review cycle - used by BOTH verify (spec) and review (code/diff).
# File: <id>.verify.yaml (target_type spec) or <id>.review.yaml (target_type result). Each round is a new session that reads only this file and continues.
target: tasks/TASK-0.md      # what's under review: the whole sketch tree (verify-tree) · the draft spec (verify) · this node's diff (review)
target_type: spec            # tree (verify decomposition) | spec (verify node draft) | result (review code diff)
level: full                  # skip | light | standard | full  (reviewer count per wave, scaled to the change's reach)
find_streak: 2               # N - find closes after N CONSECUTIVE waves confirming no NEW
                             # must-fix finding (reviewers.md §The cycle). A new must-fix
                             # resets the live counter; re-finds and record-only items don't.
plan_streak: 2               # M - a fix plan is applied only after M consecutive clean cold
                             # reviews of that plan (result cycles; spec fixes are lighter).
max_rounds: 30               # escalation trigger on FIND waves (rounds[] phase find), not the terminator

round: 1                     # total spawned passes (numbers the round files); only find waves spend max_rounds
no_new_streak: 0             # LIVE counter - consecutive completed find waves with no NEW
                             # must-fix finding. Reset to 0 by a new must-fix; NOT advanced by
                             # an aborted/incomplete wave or an unresolved candidate.
phase: find                  # find | fix - where this cycle currently is
current_item: ""             # fix phase only - the open_issues id being worked (one at a time)
item_phase: plan             # fix phase only - plan (writing/reviewing the fix plan) | confirm
plan_clear_streak: 0         # LIVE counter - consecutive clean plan reviews of the CURRENT
                             # plan text. Any plan edit resets it to 0.
status: in-progress          # in-progress | passed | escalated

# Search strategies (find phase) - a recall AID, not a terminator: assign each wave a
# strategy the earlier waves didn't run, so waves are differently-armed (identically-armed
# repeats measure luck). Seeds per target type in reviewers.md §Search strategies. No
# strategy is owed per se - the streak above is what closes find.
strategies:
  - name: single-axis-sweep
    owner: test-quality      # the lens carrying it (one owner per seed)
    ran: 1                   # the wave it ran in; empty = still owed

# The check table (verify/tree cycles only — code reviews have no checklist).
# The accumulation's persistent home: a check shown in an earlier wave stays shown (frozen bytes),
# and a NEW session resumes find from this table. A fix that edits anything `basis` cites reverts
# that check to PARTIAL; the item's confirmation round re-works exactly those.
checks:
  - id: C1
    verdict: PARTIAL         # PASS | PARTIAL | FAIL
    shown: ""                # one line — the evidence that earned the verdict
    basis: ""                # what the evidence cites (clauses · lines); a fix touching these un-shows it
    wave: 1                  # the wave that earned the current verdict

# The found list (find phase) - raw finds. CLASSIFIED AT EACH WAVE BOUNDARY, never left
# for later: `judged` records the wave's ruling (kept items also land in open_issues or
# followups with their category). Handed to every later wave as "do not re-report these
# or their shape; find what is NOT here". An entry still `pending` (classification
# undecided) blocks the no_new_streak from advancing until it is resolved.
found:
  - id: F1
    wave: 1
    lens: correctness
    where: ""
    what: ""                 # one line — who is hurt + what goes wrong
    judged: ""               # empty briefly at aggregation; then kept | dropped | merged:<id> | pending

# Per-pass outcome (append one entry per spawned pass). What lives here is the COUNTABLE
# result; the pass's reasoning lives in its own file (<id>.round<N>.brief.md · .plan.md ·
# .confirm.md) and `note` is the ONE line pointing at it. Left unbounded, `note` became
# where the narrative actually lived (394 lines of it in one node), and every later cold
# round that reads this file had to carry all of it.
# An entry is FLAT: every field on ONE line, at the entry's own indent, and only the fields
# `schema` lists. `validate` reads DEPTH — anything indented past the fields (a block
# scalar's body, a plain multi-line scalar, a nested mapping) is refused — so write `found`
# as the one-line flow map below, not as an indented block.
rounds:
  - n: 1
    phase: find              # find | plan | confirm (plan/confirm carry `item`)
    outcome: n/a             # find waves: n/a (streak is counted in no_new_streak) · plan/confirm: pass | fail
    found: { must_fix: 0, recorded: 0 }   # counts after this wave's classification
    item: ""                 # plan/confirm passes - the open_issues id they served
    note: ""                 # ONE line — what this pass settled, and which round file holds the rest

# Confirmed must-fix items that block THIS lane right now - the fix phase works them ONE
# AT A TIME (plan → plan review → apply → confirm), never as a batch.
# `kind` chooses the lane before category does:
#   defect       = the current review target is wrong (the code/diff, or the spec/tree itself)
#   contract-gap = a real issue, but it belongs in revise/verify rather than this code gate
#   concern      = a note or suspicion; never a blocker
#
# Runtime rule:
#   - result reviews may block only on `defect`
#   - spec/tree reviews may block on `defect` or `contract-gap`
#   - `concern` never blocks
#   - if the current cycle's diff/target text itself is wrong, it stays `defect` even when
#     the eventual fix also needs a later revise/verify
#
# `family` is the underlying hole/category, not the path that showed it. A review file may
# name a family only once across `open_issues` + `followups`.
#
# `category` is a FIELD with FIXED handling - `grovespec validate` refuses a record
# category here and a must-fix category in followups (except contract-gap routing), so
# what blocks is never re-argued per finding. The five must-fix categories and the two
# record categories are defined in reviewers.md §Categories; `requirement-unmet` must
# cite its `requirement` (the user's requirement, never a reviewer-invented duty).
open_issues:
  - id: F1                   # short handle, used in round notes and current_item
    kind: defect             # defect | contract-gap | concern
    family: guard-has-no-teeth
    category: normal-use-bug # crash | requirement-unmet | normal-use-bug | easy-abuse | security-hole
    condition: ""            # the ordinary situation/steps that produce it (abuse/security: the realistic path)
    impact: ""               # what reaches the user - wrong result, lost data, blocked work
    requirement: ""          # required for requirement-unmet - the ref clause / Contract·AC line it fails
    where: ""                # where (file · section · line)
    what: ""                 # what's wrong - expected vs actual, who meets it first
    measured: ""             # optional: what was actually run/observed
    closer: ""               # optional: the fix, and whether it was measured

# The RECORD list - real observations that do NOT block: improvement | harmless-bug
# (any kind - a harmless current-code defect included: kind names where the flaw lives,
# category alone decides blocking), plus contract-gap routing of a must-fix found at the
# wrong gate. This is a record, NEVER an automatic work queue: `next` (either mode) and
# later planning passes may not adopt an item from here on their own - only the user's
# explicit pick makes one into work (with every node done and only record items parked,
# `next --auto` ends instead of opening a planning session; ask mode routes to plan,
# where that pick is the decision).
followups:
  - id: F2
    kind: contract-gap       # defect (record category only) | contract-gap | concern
    family: output-contract-unspecified
    category: improvement    # improvement | harmless-bug (must-fix categories only with kind contract-gap)
    condition: "a second exporter is added and sorts differently"
    impact: "the documented consumer diff breaks - future work, no current wrongness"
    where: "docs/tasks/TASK-0.md # Contract"
    what: "the current code works, but the contract does not say whether the exported rows are stable-ordered"

# Triage adjudications - do NOT re-raise these. A later cold review reads them to avoid
# re-litigating: the caller hands them to every wave ITEMIZED (claim + verdict + reason) —
# a verdict record settles one claim, never the area around it. A scope the USER excluded
# is recorded here too (excluded-by-user, with the decision's source) - touching related
# code never revives it; only new evidence of a current must-fix category reclassifies it.
adjudications:
  - issue: ""                # short description
    verdict: dropped         # dropped (nitpick) | accepted-gap | excluded-by-user
    reason: ""               # why it's not a blocker (or where the user excluded it)
