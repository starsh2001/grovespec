# State of one cold-review cycle — used by BOTH verify (spec) and review (code/diff).
# File: <id>.verify.yaml (target_type spec) or <id>.review.yaml (target_type result). Each round is a new session that reads only this file and continues.
target: tasks/TASK-0.md      # what's under review: the whole sketch tree (verify-tree) · the draft spec (verify) · this node's diff (review)
target_type: spec            # tree (verify decomposition) | spec (verify node draft) | result (review code diff)
level: full                  # skip | light | standard | full  (reviewer count·repeat, scaled to the change's reach)
strength: 2                  # 1 | 2 | 3
repeat: 2                    # must pass N rounds in a row to finish
max_rounds: 5

round: 1
consecutive_passes: 0
status: in-progress          # in-progress | passed | escalated

# Per-round outcome (append one entry per round)
rounds:
  - n: 1
    outcome: fail            # pass | fail
    found: { critical: 0, should_fix: 0, nice: 0 }   # counts after triage

# Confirmed issues for the caller to fix (this round)
open_issues:
  - severity: critical       # critical | should-fix | nice-to-have
    where: ""                # where (file · section · line)
    what: ""                 # what's wrong

# Triage adjudications — do NOT re-raise these. A later cold review reads them to avoid re-litigating.
adjudications:
  - issue: ""                # short description
    verdict: dropped         # dropped (nitpick) | accepted-gap
    reason: ""               # why it's not a blocker
