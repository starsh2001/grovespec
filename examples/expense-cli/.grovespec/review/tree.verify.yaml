# Survey fidelity gate — the mapped (brownfield) tree was cold-verified against the code
# (code↔tree coverage · contract↔behavior samples · no beautification · backlog honesty),
# then a human approved the survey. This is what a completed brownfield adoption carries.
target: docs/tree.md
target_type: tree
level: standard
find_streak: 2
max_rounds: 30

round: 2
no_new_streak: 2
status: passed
approved_by: human

rounds:
  - n: 1
    phase: find
    outcome: n/a
    found: { must_fix: 0, recorded: 0 }
  - n: 2
    phase: find
    outcome: n/a
    found: { must_fix: 0, recorded: 0 }

open_issues: []

adjudications: []
